name: Release

# main.js / styles.css / manifest.json 推送到 main 后：manifest 里的版本号还没有对应的标签，就发一个新版本。
# Obsidian 社区插件的要求：标签 = manifest.json 的 version（不带 v），附件是 main.js、manifest.json、styles.css。
# 版本号由本地的 sync.sh 自动加一（提交说明末尾写 #minor / #major 升大版本）。
on:
  push:
    branches: [main]
    paths: ["main.js", "styles.css", "manifest.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: ver
        run: |
          new=$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")
          python3 -c "import json,sys;v=json.load(open('versions.json'));sys.exit(0 if '$new' in v else 'versions.json has no entry for $new')"
          prev=$(git describe --tags --abbrev=0 --match '[0-9]*' 2>/dev/null || true)
          if git rev-parse -q --verify "refs/tags/$new" >/dev/null; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "prev=$prev" >> "$GITHUB_OUTPUT"

      - name: Write notes
        if: steps.ver.outputs.skip == 'false'
        run: |
          range="${{ steps.ver.outputs.prev }}"
          [ -n "$range" ] && range="$range..HEAD" || range="HEAD"
          {
            echo "## Changes"
            echo
            git log --no-merges --format='- %s' $range | sed -E 's/ *#(minor|major)[[:space:]]*$//'
            echo
            echo "Install: download \`main.js\`, \`manifest.json\` and \`styles.css\` into \`<vault>/.obsidian/plugins/nautilus-spiral/\`, or use BRAT."
          } > notes.md
          cat notes.md

      - name: Publish
        if: steps.ver.outputs.skip == 'false'
        run: gh release create "${{ steps.ver.outputs.new }}" main.js manifest.json styles.css --target "$GITHUB_SHA" --title "${{ steps.ver.outputs.new }}" --notes-file notes.md --latest
        env:
          GH_TOKEN: ${{ github.token }}
